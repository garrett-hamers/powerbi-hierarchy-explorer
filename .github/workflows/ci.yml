name: CI

on:
  push:
    branches:
      - main
      - "garrett-hamers-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run eslint
      - name: Tests
        run: npm test
      - name: Package
        run: npm run package
      - name: Reproducibility
        run: npm run verify-reproducible-package
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlyn-hierarchy-explorer-package
          path: |
            dist/*.pbiviz
            dist/release-manifest.json
          if-no-files-found: error
      - name: Certification audit
        run: npm run certification-audit
      - name: Full dependency audit
        run: npm audit
