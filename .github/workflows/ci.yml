name: CI

on:
  push:
    branches:
      - main
      - certification
      - "garrett-hamers-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run eslint
      - name: Tests
        run: npm test
      - name: Package
        run: npm run package
      - name: Reproducibility
        run: npm run verify-reproducible-package
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlyn-hierarchy-explorer-package
          path: |
            dist/*.pbiviz
            dist/release-manifest.json
          if-no-files-found: error
      - name: Certification audit
        run: npm run certification-audit
      - name: Full dependency audit
        run: npm audit

  # Renders the three submission scenes and applies each scene's own content
  # expectations. It never compares image bytes - those are not reproducible
  # even between two runs on one machine - and it never writes into
  # assets/screenshots. What it proves is that the current source still draws
  # the scenes the committed screenshots claim to show.
  #
  # Kept in its own job so Playwright, which is installed here and nowhere else,
  # stays off the dependency surface the validate job audits.
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Build the visual
        run: npx pbiviz package
      - name: Verify the screenshot scenes still render
        run: npm run verify-screenshots

  # Loads the packaged .pbiviz in headless Chromium and measures every element
  # against the box that actually clips it, across five host tile sizes, seven
  # expansion/direction states and four scroll offsets. A Power BI tile clips at
  # its own edge with no scrollbar, so content laid out beyond it is discarded
  # in silence - this job is what makes that noise.
  #
  # It shares the screenshot job's reason for being separate: Playwright is
  # installed here and nowhere else, so it stays off the dependency surface the
  # validate job audits. If no Chromium can be launched the probe throws, because
  # a run that measured nothing must not report success.
  layout-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Build the visual
        run: npx pbiviz package
      - name: Probe the packaged visual for escaping content
        run: npm run probe-layout
      - name: Upload the layout probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-probe-report
          path: .tmp/layout-probe/report.json
          if-no-files-found: warn
